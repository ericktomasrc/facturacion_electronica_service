<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado del servicio de facturación</title>
<style>
  :root {
    --fondo:#f6f7f9; --panel:#ffffff; --sutil:#f1f3f5; --borde:#e3e6ea;
    --texto:#1b1f24; --tenue:#5c6570;
    --sano:#15803d; --atencion:#a16207; --problema:#b91c1c;
    --acento:#2563eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fondo:#0f1115; --panel:#171a21; --sutil:#1c212b; --borde:#262b36;
      --texto:#e6e8ec; --tenue:#98a1ae;
      --sano:#3fb950; --atencion:#d29922; --problema:#f85149;
      --acento:#4493f8;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--fondo); color:var(--texto);
         font:15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .contenedor { max-width:1000px; margin:0 auto; }

  header { display:flex; align-items:center; justify-content:space-between;
           gap:16px; margin-bottom:8px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; font-weight:500; }

  nav { display:flex; gap:18px; border-bottom:1px solid var(--borde);
        margin-bottom:16px; }
  nav a { color:var(--tenue); text-decoration:none; font-size:14px;
          padding:0 2px 9px; border-bottom:2px solid transparent;
          margin-bottom:-1px; }
  nav a:hover { color:var(--texto); }
  nav a.activo { color:var(--texto); border-bottom-color:var(--acento); }

  .controles { display:flex; gap:8px; align-items:center; }
  input, button { background:var(--panel); border:1px solid var(--borde);
    color:var(--texto); padding:7px 11px; border-radius:7px; font:inherit;
    font-size:14px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:#3a4152; }
  button:disabled { opacity:.5; cursor:default; }
  button.principal { background:var(--acento); border-color:var(--acento);
                     color:#fff; font-weight:500; }
  button.mini { padding:4px 9px; font-size:13px; }

  .semaforo { display:flex; align-items:center; gap:12px; padding:16px 18px;
    border-radius:10px; border:1px solid var(--borde); background:var(--panel);
    margin-bottom:18px; }
  .punto { width:13px; height:13px; border-radius:50%; flex:none; }
  .Sano .punto { background:var(--sano); }
  .Atencion .punto { background:var(--atencion); }
  .Problema .punto { background:var(--problema); }
  .Sano .etiqueta { color:var(--sano); }
  .Atencion .etiqueta { color:var(--atencion); }
  .Problema .etiqueta { color:var(--problema); }
  .etiqueta { font-weight:500; letter-spacing:.02em; }
  .alertas { margin:0; padding-left:20px; }
  .alertas li { margin:5px 0; }

  .tarjetas { display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px; margin-bottom:18px; }
  .tarjeta { background:var(--sutil); border-radius:10px; padding:14px 16px; }
  .tarjeta .valor { font-size:26px; font-weight:500; }
  .tarjeta .nombre { color:var(--tenue); font-size:13px; margin-top:2px; }

  section { background:var(--panel); border:1px solid var(--borde);
            border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--tenue);
       text-transform:uppercase; letter-spacing:.06em; font-weight:500; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--tenue); font-weight:500; padding:6px 8px;
       border-bottom:1px solid var(--borde); }
  td { padding:8px; border-bottom:1px solid #1d222c; vertical-align:top; }
  tr:last-child td { border-bottom:none; }

  .mono { font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  .recorte { max-width:400px; overflow:hidden; text-overflow:ellipsis;
             white-space:nowrap; }
  .vacio { color:var(--tenue); font-style:italic; }
  .mal { color:var(--problema); }
  footer { color:var(--tenue); font-size:13px; margin-top:18px; }

  #avisos { position:fixed; top:20px; right:20px; z-index:100;
            display:flex; flex-direction:column; gap:8px; max-width:380px; }
  .aviso-flotante { background:var(--panel); border:1px solid var(--borde);
    border-left:3px solid var(--acento); border-radius:8px; padding:11px 14px;
    font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.4);
    animation:entrar .18s ease-out; }
  .aviso-flotante.ok  { border-left-color:var(--sano); }
  .aviso-flotante.mal { border-left-color:var(--problema); }
  .aviso-flotante .titulo { font-weight:500; margin-bottom:2px; }
  .aviso-flotante .detalle { color:var(--tenue); font-size:13px; }
  @keyframes entrar { from { opacity:0; transform:translateX(16px); } }
</style>
</head>
<body>

<div id="avisos"></div>

<div class="contenedor">
  <header>
    <h1>Facturación electrónica</h1>
    <div class="controles">
      <input id="clave" type="password" placeholder="Clave de operador" size="22">
      <button id="actualizar" class="principal">Actualizar</button>
    </div>
  </header>

  <nav>
    <a href="/diagnostico.html" class="activo">Estado del servicio</a>
    <a href="/admin.html">Empresas</a>
    <a href="/comprobantes.html">Comprobantes</a>
  </nav>

  <div id="contenido">
    <section class="vacio">Introduce la clave de operador y pulsa Actualizar.</section>
  </div>

  <footer id="pie"></footer>
</div>

<script>
// NO SE USA "$" COMO NOMBRE DE FUNCIÓN: Browser Link, la herramienta de
// Visual Studio que recarga la página al guardar, inyecta jQuery y espera
// encontrarlo ahí. Definir otra cosa rompe su script con un error que
// parece del panel y no lo es.
const elem = id => document.getElementById(id);

const claveInput = elem("clave");
claveInput.value = sessionStorage.getItem("claveOperador") || "";

elem("actualizar").onclick = cargar;
claveInput.onkeydown = e => { if (e.key === "Enter") cargar(); };

function avisar(titulo, detalle = "", tipo = "") {
  const caja = document.createElement("div");
  caja.className = "aviso-flotante " + tipo;

  caja.innerHTML =
    `<div class="titulo">${escapar(titulo)}</div>` +
    (detalle ? `<div class="detalle">${escapar(detalle)}</div>` : "");

  elem("avisos").appendChild(caja);

  setTimeout(() => caja.remove(), tipo === "mal" ? 8000 : 4000);
}

async function cargar() {
  sessionStorage.setItem("claveOperador", claveInput.value);

  const boton = elem("actualizar");
  boton.disabled = true;

  try {
    const respuesta = await fetch("/admin/salud", {
      headers: { "X-Admin-Key": claveInput.value }
    });

    if (respuesta.status === 401) {
      elem("contenido").innerHTML =
        `<section class="mal">Clave de operador no válida.</section>`;
      return;
    }

    if (!respuesta.ok) {
      elem("contenido").innerHTML =
        `<section class="mal">El servicio respondió ${respuesta.status}.</section>`;
      return;
    }

    pintar(await respuesta.json());

    elem("pie").textContent =
      "Última consulta: " + new Date().toLocaleTimeString("es-PE");

  } catch (error) {
    elem("contenido").innerHTML =
      `<section class="mal">No se pudo contactar el servicio: ${escapar(error.message)}</section>`;
  } finally {
    boton.disabled = false;
  }
}

function pintar(d) {
  const partes = [];

  partes.push(`
    <div class="semaforo ${d.nivel}">
      <span class="punto"></span>
      <div>
        <div class="etiqueta">${textoNivel(d.nivel)}</div>
        <ul class="alertas">${d.alertas.map(a => `<li>${escapar(a)}</li>`).join("")}</ul>
      </div>
    </div>`);

  partes.push(`
    <div class="tarjetas">
      ${tarjeta(d.cola.pendientes, "En cola")}
      ${tarjeta(d.cola.esperandoReintento, "Esperando reintento")}
      ${tarjeta(d.cola.requierenRevision, "Requieren revisión")}
      ${tarjeta(d.hoy.aceptados, "Aceptados hoy")}
      ${tarjeta(d.hoy.rechazados, "Rechazados hoy")}
      ${tarjeta(d.hoy.tasaExito + "%", "Tasa de éxito")}
    </div>`);

  if (d.certificados.length) {
    partes.push(seccion("Certificados", `
      <table>
        <tr><th>Empresa</th><th>Vence</th><th>Días</th></tr>
        ${d.certificados.map(c => `
          <tr>
            <td>${escapar(c.razonSocial)} <span class="mono">${escapar(c.ruc)}</span></td>
            <td class="mono">${c.validoHasta.slice(0, 10)}</td>
            <td class="${c.diasRestantes <= 30 ? "mal" : ""}">${c.diasRestantes}</td>
          </tr>`).join("")}
      </table>`));
  }

  if (d.erroresFrecuentes.length) {
    partes.push(seccion("Errores más frecuentes (24 h)", `
      <table>
        <tr><th>Código</th><th>Veces</th><th>Mensaje</th></tr>
        ${d.erroresFrecuentes.map(e => `
          <tr>
            <td class="mono">${escapar(e.codigoSunat ?? "—")}</td>
            <td>${e.veces}</td>
            <td class="recorte" title="${escapar(e.mensaje ?? "")}">${escapar(e.mensaje ?? "")}</td>
          </tr>`).join("")}
      </table>`));
  }

  if (d.atascados.length) {
    partes.push(seccion("Comprobantes con problemas", `
      <table>
        <tr><th>Número</th><th>Estado</th><th>Fallos</th><th>Mensaje</th><th></th></tr>
        ${d.atascados.map(c => `
          <tr>
            <td class="mono">${escapar(c.numero)}</td>
            <td>${escapar(c.estado)}</td>
            <td>${c.intentosFallidos}</td>
            <td class="recorte" title="${escapar(c.ultimoMensaje ?? "")}">${escapar(c.ultimoMensaje ?? "—")}</td>
            <td><button class="mini" data-reprocesar="${c.id}">Reprocesar</button></td>
          </tr>`).join("")}
      </table>`));
  }

  elem("contenido").innerHTML = partes.join("");

  document.querySelectorAll("button[data-reprocesar]").forEach(boton =>
    boton.onclick = () => reprocesar(boton.dataset.reprocesar, boton));
}

async function reprocesar(id, boton) {
  boton.disabled = true;

  try {
    const respuesta = await fetch(`/admin/comprobantes/${id}/reprocesar`, {
      method: "POST",
      headers: { "X-Admin-Key": claveInput.value }
    });

    const cuerpo = await respuesta.json().catch(() => ({}));

    if (respuesta.ok) {
      avisar("Devuelto a la cola",
             "El worker lo tomará en el siguiente ciclo.", "ok");
    } else {
      avisar(cuerpo.error || "No se pudo reprocesar", cuerpo.detalle, "mal");
    }

    await cargar();

  } catch (e) {
    avisar("Error al reprocesar", e.message, "mal");
    boton.disabled = false;
  }
}

const tarjeta = (valor, nombre) =>
  `<div class="tarjeta"><div class="valor">${valor}</div><div class="nombre">${nombre}</div></div>`;

const seccion = (titulo, contenido) =>
  `<section><h2>${titulo}</h2>${contenido}</section>`;

const textoNivel = nivel => ({
  Sano: "Todo en orden",
  Atencion: "Requiere atención",
  Problema: "Hay un problema"
}[nivel] || nivel);

const escapar = t => String(t ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

if (claveInput.value) cargar();
</script>
</body>
</html>
