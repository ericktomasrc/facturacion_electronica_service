<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · Facturación electrónica</title>
<style>
  :root {
    --fondo:#f6f7f9; --panel:#ffffff; --sutil:#f1f3f5;
    --borde:#e3e6ea; --borde-fuerte:#cfd4da;
    --texto:#1b1f24; --tenue:#5c6570; --apagado:#8a929c;
    --acento:#2563eb; --acento-fondo:#eef4ff;
    --ok:#15803d; --ok-fondo:#eaf6ee;
    --aviso:#a16207; --aviso-fondo:#fdf5e3;
    --mal:#b91c1c; --mal-fondo:#fdeded;
    --radio:8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fondo:#0f1115; --panel:#171a21; --sutil:#1c212b;
      --borde:#262b36; --borde-fuerte:#3a4152;
      --texto:#e6e8ec; --tenue:#98a1ae; --apagado:#6f7884;
      --acento:#4493f8; --acento-fondo:#12233c;
      --ok:#3fb950; --ok-fondo:#122a18;
      --aviso:#d29922; --aviso-fondo:#2b2311;
      --mal:#f85149; --mal-fondo:#2d1516;
    }
  }

  * { box-sizing:border-box; }
  body { margin:0; padding:22px; background:var(--fondo); color:var(--texto);
         font:15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .contenedor { max-width:1100px; margin:0 auto; }

  header { display:flex; align-items:center; justify-content:space-between;
           gap:16px; margin-bottom:6px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; font-weight:500; }

  nav { display:flex; gap:18px; border-bottom:1px solid var(--borde);
        margin-bottom:18px; flex-wrap:wrap; }
  nav a { color:var(--tenue); text-decoration:none; font-size:14px;
          padding:0 2px 9px; border-bottom:2px solid transparent;
          margin-bottom:-1px; }
  nav a:hover { color:var(--texto); }
  nav a.activo { color:var(--texto); border-bottom-color:var(--acento); }

  .usuario { display:flex; align-items:center; gap:12px; font-size:13.5px;
             color:var(--tenue); }
  .usuario .rol { background:var(--sutil); border-radius:var(--radio);
                  padding:2px 9px; font-size:12px; }
  .usuario a { color:var(--acento); text-decoration:none; }

  .pestanas { display:flex; gap:16px; border-bottom:1px solid var(--borde);
              margin-bottom:16px; }
  .pestana { font-size:14px; color:var(--tenue); cursor:pointer;
             padding:0 2px 9px; border-bottom:2px solid transparent;
             margin-bottom:-1px; background:none; border-top:none;
             border-left:none; border-right:none; }
  .pestana.activa { color:var(--texto); border-bottom-color:var(--acento); }

  section { background:var(--panel); border:1px solid var(--borde);
            border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  h2 { font-size:14px; margin:0 0 4px; color:var(--tenue);
       text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .ayuda { color:var(--tenue); font-size:13.5px; margin:0 0 16px; }

  input, select, button, textarea { font:inherit; font-size:14px;
    color:var(--texto); background:var(--panel); border:1px solid var(--borde);
    border-radius:var(--radio); padding:8px 12px; }
  input:focus, select:focus { outline:none; border-color:var(--acento); }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--borde-fuerte); }
  button:disabled { opacity:.5; cursor:default; }
  button.principal { background:var(--acento); border-color:var(--acento);
                     color:#fff; font-weight:500; }
  button.peligro { color:var(--mal); }
  button.mini { padding:4px 10px; font-size:12.5px; }

  label { display:block; font-size:12px; color:var(--tenue); margin-bottom:4px; }
  .rejilla { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
             gap:11px; margin-bottom:14px; }
  label input, label select { width:100%; }

  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; color:var(--tenue); font-weight:400; padding:7px 8px;
       border-bottom:1px solid var(--borde); font-size:12.5px; }
  td { padding:9px 8px; border-bottom:1px solid var(--borde); }
  tr:last-child td { border-bottom:none; }
  tr.inactiva td:not(:last-child) { opacity:.55; }

  .mono { font-family:ui-monospace, Consolas, monospace; font-size:12.5px; }
  .tenue { color:var(--tenue); }
  .vacio { color:var(--tenue); padding:16px 0; }

  .insignia { font-size:11.5px; padding:2px 9px; border-radius:var(--radio);
              white-space:nowrap; }
  .i-ok { background:var(--ok-fondo); color:var(--ok); }
  .i-aviso { background:var(--aviso-fondo); color:var(--aviso); }
  .i-tenue { background:var(--sutil); color:var(--tenue); }
  .i-mal { background:var(--mal-fondo); color:var(--mal); }

  .secreto { background:var(--ok-fondo); border:1px solid var(--ok);
             border-radius:var(--radio); padding:13px 15px; margin-top:12px; }
  .secreto code { display:block; font-family:ui-monospace,Consolas,monospace;
    font-size:15px; margin:9px 0; color:var(--ok); }

  /* Permisos agrupados por área */
  .area { margin-bottom:16px; }
  .area h3 { font-size:12.5px; color:var(--tenue); margin:0 0 8px;
             text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .permiso { display:flex; gap:10px; align-items:flex-start;
             padding:8px 10px; border-radius:var(--radio); }
  .permiso:hover { background:var(--sutil); }
  .permiso input { margin:2px 0 0; width:16px; height:16px; flex:none;
                   accent-color:var(--acento); }
  .permiso .texto { flex:1; }
  .permiso .nombre { font-size:14px; }
  .permiso .desc { font-size:12.5px; color:var(--tenue); }
  .area.critico { border-left:2px solid var(--aviso); padding-left:12px; }

  #avisos { position:fixed; top:18px; right:18px; z-index:60;
            display:flex; flex-direction:column; gap:8px; max-width:370px; }
  .flotante { background:var(--panel); border:1px solid var(--borde);
    border-left:3px solid var(--acento); border-radius:var(--radio);
    padding:11px 14px; font-size:14px; box-shadow:0 6px 22px rgba(0,0,0,.14); }
  .flotante.ok { border-left-color:var(--ok); }
  .flotante.mal { border-left-color:var(--mal); }
  .flotante .t { font-weight:500; }
  .flotante .d { color:var(--tenue); font-size:13px; margin-top:2px; }

  .velo { position:fixed; inset:0; background:rgba(15,18,23,.5); z-index:70;
          display:none; align-items:center; justify-content:center; padding:20px; }
  .velo.visible { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--borde);
           border-radius:14px; padding:22px 24px; width:100%; max-width:620px;
           max-height:88vh; overflow-y:auto; }
  .modal h3 { margin:0 0 4px; font-size:17px; font-weight:500; }
  .modal .botones { display:flex; gap:8px; justify-content:flex-end;
                    margin-top:18px; }
</style>
</head>
<body>

<div id="avisos"></div>

<div class="velo" id="velo-confirmar">
  <div class="modal" style="max-width:430px">
    <h3 id="cf-titulo"></h3>
    <p class="ayuda" id="cf-texto"></p>
    <div class="botones">
      <button id="cf-cancelar">Cancelar</button>
      <button id="cf-aceptar" class="principal">Confirmar</button>
    </div>
  </div>
</div>

<div class="velo" id="velo-rol">
  <div class="modal">
    <h3 id="rol-titulo">Nuevo rol</h3>
    <p class="ayuda">
      Marca lo que este rol podrá hacer. Quien lo tenga verá solo las
      pantallas correspondientes.
    </p>

    <div class="rejilla">
      <label>Nombre<input id="rol-nombre" placeholder="Supervisor de cobranzas"></label>
      <label>Descripción<input id="rol-desc" placeholder="opcional"></label>
    </div>

    <div id="rol-permisos"></div>

    <div class="botones">
      <button id="rol-cancelar">Cancelar</button>
      <button id="rol-guardar" class="principal">Guardar</button>
    </div>
  </div>
</div>

<div class="contenedor">
  <header>
    <h1>Facturación electrónica</h1>
    <div id="usuario-actual" class="usuario"></div>
  </header>

  <nav id="menu"></nav>

  <div class="pestanas">
    <button class="pestana activa" data-vista="usuarios">Usuarios</button>
    <button class="pestana" data-vista="roles">Roles y permisos</button>
  </div>

  <div id="contenido"><div class="vacio">Cargando…</div></div>
</div>

<script>
const elem = id => document.getElementById(id);

const esc = t => String(t ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const estado = {
  vista: "usuarios",
  usuarios: [],
  roles: [],
  permisos: [],
  rolEditando: null
};

let usuarioActual = null;

function avisar(titulo, detalle = "", tipo = "") {
  const caja = document.createElement("div");
  caja.className = "flotante " + tipo;
  caja.innerHTML = `<div class="t">${esc(titulo)}</div>` +
                   (detalle ? `<div class="d">${esc(detalle)}</div>` : "");
  elem("avisos").appendChild(caja);
  setTimeout(() => caja.remove(), tipo === "mal" ? 8000 : 4000);
}

function confirmar(titulo, texto, textoBoton = "Confirmar") {
  return new Promise(resolver => {
    elem("cf-titulo").textContent = titulo;
    elem("cf-texto").textContent = texto;
    elem("cf-aceptar").textContent = textoBoton;
    elem("velo-confirmar").classList.add("visible");

    const cerrar = r => {
      elem("velo-confirmar").classList.remove("visible");
      resolver(r);
    };

    elem("cf-aceptar").onclick = () => cerrar(true);
    elem("cf-cancelar").onclick = () => cerrar(false);
  });
}

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, opciones);

  if (r.status === 401) {
    location.href = "/login.html";
    throw new Error("Sesión caducada.");
  }

  const cuerpo = await r.json().catch(() => ({}));

  if (!r.ok) {
    const error = new Error(cuerpo.error || `Error ${r.status}`);
    error.detalle = cuerpo.detalle || "";
    throw error;
  }

  return cuerpo;
}

// ------------------------------------------------------------------- menú
//
// El menú se arma según los permisos del usuario: cada quien ve solo las
// pantallas que puede usar.
//
// OCULTAR NO ES PROTEGER. El servidor comprueba el permiso en cada petición;
// esto solo evita mostrar opciones que darían un error al pulsarlas.

const PANTALLAS = [
  { url:"/diagnostico.html", texto:"Estado del servicio", permiso:"diagnostico.ver" },
  { url:"/admin.html",       texto:"Empresas",            permiso:"empresas.ver" },
  { url:"/comprobantes.html",texto:"Comprobantes",        permiso:"comprobantes.ver" },
  { url:"/usuarios.html",    texto:"Usuarios",            permiso:"usuarios.gestionar" },
  { url:"/cuenta.html",      texto:"Mi cuenta",           permiso:null }
];

function pintarMenu() {
  const actual = location.pathname;

  elem("menu").innerHTML = PANTALLAS
    .filter(p => p.permiso === null || puede(p.permiso))
    .map(p => `<a href="${p.url}" class="${actual === p.url ? "activo" : ""}">
                 ${esc(p.texto)}</a>`)
    .join("");
}

const puede = permiso => usuarioActual?.permisos?.includes(permiso) === true;

async function cargarUsuario() {
  const r = await fetch("/admin/yo");

  if (r.status === 401) { location.href = "/login.html"; return false; }

  usuarioActual = await r.json();

  elem("usuario-actual").innerHTML =
    `<span>${esc(usuarioActual.nombre || usuarioActual.correo)}</span>` +
    `<span class="rol">${esc(usuarioActual.rol)}</span>` +
    `<a href="#" id="salir">Salir</a>`;

  elem("salir").onclick = async e => {
    e.preventDefault();
    await fetch("/admin/sesion", { method: "DELETE" });
    location.href = "/login.html";
  };

  pintarMenu();

  return true;
}

// --------------------------------------------------------------- pestañas

document.querySelectorAll("[data-vista]").forEach(b =>
  b.onclick = () => {
    estado.vista = b.dataset.vista;

    document.querySelectorAll("[data-vista]").forEach(x =>
      x.classList.toggle("activa", x.dataset.vista === estado.vista));

    cargar();
  });

async function cargar() {
  try {
    if (estado.vista === "usuarios") {
      [estado.usuarios, estado.roles] = await Promise.all([
        api("/admin/usuarios"),
        api("/admin/roles")
      ]);

      pintarUsuarios();

    } else {
      [estado.roles, estado.permisos] = await Promise.all([
        api("/admin/roles"),
        api("/admin/roles/permisos")
      ]);

      pintarRoles();
    }
  } catch (e) {
    elem("contenido").innerHTML =
      `<section class="vacio" style="color:var(--mal)">${esc(e.message)}</section>`;
  }
}

// -------------------------------------------------------------- usuarios

function pintarUsuarios() {
  elem("contenido").innerHTML = `
    <section>
      <h2>Crear usuario</h2>
      <p class="ayuda">
        Se le enviará un correo con una contraseña provisional que deberá
        cambiar al entrar.
      </p>

      <div class="rejilla">
        <label>Correo<input id="n-correo" type="email" placeholder="persona@empresa.pe"></label>
        <label>Nombre<input id="n-nombre" placeholder="Nombre y apellido"></label>
        <label>Rol
          <select id="n-rol">
            ${estado.roles.map(r =>
              `<option value="${r.id}">${esc(r.nombre)}</option>`).join("")}
          </select></label>
      </div>

      <button class="principal" id="btn-crear">Crear usuario</button>
      <div id="resultado-usuario"></div>
    </section>

    <section>
      <h2>Usuarios</h2>
      <table>
        <tr><th>Persona</th><th>Rol</th><th>Verificación</th>
            <th>Último ingreso</th><th>Cuenta</th>
            <th style="text-align:right">Acciones</th></tr>
        ${estado.usuarios.map(filaUsuario).join("")}
      </table>
    </section>`;

  elem("btn-crear").onclick = crearUsuario;

  document.querySelectorAll("[data-rol-de]").forEach(s =>
    s.onchange = () => cambiarRol(s.dataset.rolDe, s.value));

  document.querySelectorAll("[data-alternar]").forEach(b =>
    b.onclick = () => alternarUsuario(b.dataset.alternar, b.dataset.activo !== "true"));

  document.querySelectorAll("[data-restablecer]").forEach(b =>
    b.onclick = () => restablecer(b.dataset.restablecer, b.dataset.correo));
}

/// El estado de un usuario no es solo activo o inactivo.
///
/// Una cuenta creada cuya contraseña provisional caducó está activa pero no
/// puede entrar, y eso hay que verlo de un vistazo: si no, el administrador
/// cree que todo está bien y la persona sigue sin poder trabajar.
/// El estado del segundo factor, en su propia columna.
///
/// Antes decía "sin activar" en ámbar y se confundía con el estado de la
/// cuenta: parecía una advertencia sobre el usuario cuando solo hablaba de
/// la verificación en dos pasos.
function estadoSegundoFactor(u) {
  if (u.totpActivo)
    return '<span class="insignia i-ok">configurada</span>';

  if (u.debeConfigurarTotp)
    return '<span class="insignia i-aviso" title="Se la pedirá la próxima ' +
           'vez que entre.">pendiente</span>';

  return '<span class="tenue" style="font-size:12.5px">—</span>';
}

function estadoUsuario(u) {
  if (!u.activo)
    return '<span class="insignia i-tenue">inactivo</span>';

  if (u.provisionalCaducada)
    return '<span class="insignia i-mal" title="La contraseña provisional ' +
           'caducó. Restablécela para que pueda entrar.">caducada</span>';

  if (u.debeCambiar)
    return '<span class="insignia i-aviso" title="Todavía no ha entrado. ' +
           'Su contraseña provisional sigue vigente.">sin estrenar</span>';

  return '<span class="insignia i-ok">activo</span>';
}

function filaUsuario(u) {
  const yo = u.correo === usuarioActual.correo;

  return `<tr class="${u.activo ? "" : "inactiva"}">
    <td>
      <div>${esc(u.nombre || "—")} ${yo ? '<span class="tenue">(tú)</span>' : ""}</div>
      <div class="mono tenue">${esc(u.correo)}</div>
    </td>
    <td>
      <select data-rol-de="${u.id}" ${yo ? "disabled" : ""}
              title="${yo ? "No puedes cambiarte el rol a ti mismo." : ""}">
        ${estado.roles.map(r =>
          `<option value="${r.id}" ${r.id === u.rolId ? "selected" : ""}>
             ${esc(r.nombre)}</option>`).join("")}
      </select>
    </td>
    <td>${estadoSegundoFactor(u)}</td>
    <td class="tenue">${u.ultimoIngreso
        ? new Date(u.ultimoIngreso).toLocaleDateString("es-PE") : "nunca"}</td>
    <td>${estadoUsuario(u)}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="mini" data-restablecer="${u.id}"
              data-correo="${esc(u.correo)}">Restablecer</button>
      ${yo ? "" : `<button class="mini ${u.activo ? "peligro" : ""}"
                     data-alternar="${u.id}" data-activo="${u.activo}">
                     ${u.activo ? "Desactivar" : "Activar"}</button>`}
    </td>
  </tr>`;
}

async function crearUsuario() {
  const correo = elem("n-correo").value.trim();

  if (!correo.includes("@")) {
    avisar("El correo no es válido", "", "mal");
    return;
  }

  const boton = elem("btn-crear");
  boton.disabled = true;

  try {
    const r = await api("/admin/usuarios", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        correo,
        nombre: elem("n-nombre").value.trim(),
        rolId: elem("n-rol").value
      })
    });

    // La contraseña se muestra fija aunque se haya enviado por correo: si
    // el envío falla, es la única copia que queda.
    elem("resultado-usuario").innerHTML = `
      <div class="secreto">
        <strong>Contraseña provisional</strong>
        <code>${esc(r.contrasenaProvisional)}</code>
        <div class="tenue" style="font-size:12.5px">${esc(r.aviso)}</div>
      </div>`;

    elem("n-correo").value = "";
    elem("n-nombre").value = "";

    estado.usuarios = await api("/admin/usuarios");

    // Se repinta solo la tabla para no borrar la contraseña que el operador
    // todavía no ha copiado.
    const seccion = document.querySelectorAll("section")[1];
    if (seccion) {
      seccion.querySelector("table").innerHTML = `
        <tr><th>Persona</th><th>Rol</th><th>Verificación</th>
            <th>Último ingreso</th><th>Cuenta</th>
            <th style="text-align:right">Acciones</th></tr>
        ${estado.usuarios.map(filaUsuario).join("")}`;

      enlazarTabla();
    }

    avisar("Usuario creado", "", "ok");

  } catch (e) {
    avisar(e.message, e.detalle, "mal");
  } finally {
    boton.disabled = false;
  }
}

function enlazarTabla() {
  document.querySelectorAll("[data-rol-de]").forEach(s =>
    s.onchange = () => cambiarRol(s.dataset.rolDe, s.value));

  document.querySelectorAll("[data-alternar]").forEach(b =>
    b.onclick = () => alternarUsuario(b.dataset.alternar, b.dataset.activo !== "true"));

  document.querySelectorAll("[data-restablecer]").forEach(b =>
    b.onclick = () => restablecer(b.dataset.restablecer, b.dataset.correo));
}

async function cambiarRol(usuarioId, rolId) {
  const rol = estado.roles.find(r => r.id === rolId);
  const usuario = estado.usuarios.find(u => u.id === usuarioId);

  // AVISO AL DAR PERMISOS DE ADMINISTRACIÓN.
  //
  // No se bloquea, porque tener un solo administrador es peligroso: si
  // pierdes el acceso, nadie puede rescatarte y habría que tocar la base de
  // datos a mano.
  //
  // Pero sí se dice en voz alta lo que implica, que es fácil de pasar por
  // alto al elegir de una lista.
  if (rol?.permisos?.includes("usuarios.gestionar")) {
    const seguro = await confirmar(
      `Dar acceso de administración a ${usuario?.nombre || usuario?.correo}`,

      `El rol "${rol.nombre}" permite gestionar usuarios y roles. Quien lo ` +
      "tenga podrá crear cuentas, cambiar permisos y, si quisiera, quitarte " +
      "el acceso a ti.\n\nDáselo solo a quien confíes como a ti mismo.",

      "Sí, dar acceso");

    if (!seguro) {
      await cargar();
      return;
    }
  }

  try {
    await api(`/admin/usuarios/${usuarioId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rolId })
    });

    avisar("Rol cambiado",
           "Se aplica en la siguiente petición de esa persona.", "ok");

    await cargar();

  } catch (e) {
    avisar(e.message, e.detalle, "mal");
    await cargar();
  }
}

async function alternarUsuario(usuarioId, activar) {
  if (!activar) {
    const seguro = await confirmar(
      "Desactivar usuario",
      "Sus sesiones abiertas se cerrarán de inmediato y no podrá volver a " +
      "entrar. La cuenta no se borra: puedes reactivarla después.",
      "Desactivar");

    if (!seguro) return;
  }

  try {
    await api(`/admin/usuarios/${usuarioId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ activo: activar })
    });

    avisar(activar ? "Usuario activado" : "Usuario desactivado", "", "ok");
    await cargar();

  } catch (e) {
    avisar(e.message, e.detalle, "mal");
  }
}

async function restablecer(usuarioId, correo) {
  const seguro = await confirmar(
    "Restablecer contraseña",
    `Se generará una contraseña provisional para ${correo} y se cerrarán ` +
    "todas sus sesiones. Tendrá que cambiarla al entrar.",
    "Restablecer");

  if (!seguro) return;

  try {
    const r = await api(`/admin/usuarios/${usuarioId}/restablecer`,
                        { method: "POST" });

    elem("resultado-usuario").innerHTML = `
      <div class="secreto">
        <strong>Contraseña provisional de ${esc(correo)}</strong>
        <code>${esc(r.contrasenaProvisional)}</code>
        <div class="tenue" style="font-size:12.5px">${esc(r.aviso)}</div>
      </div>`;

    window.scrollTo({ top: 0, behavior: "smooth" });

  } catch (e) {
    avisar(e.message, e.detalle, "mal");
  }
}

// ------------------------------------------------------------------ roles

function pintarRoles() {
  elem("contenido").innerHTML = `
    <section>
      <div style="display:flex;justify-content:space-between;
                  align-items:center;gap:12px;margin-bottom:14px">
        <div>
          <h2 style="margin:0">Roles</h2>
          <p class="ayuda" style="margin:4px 0 0">
            Un rol agrupa permisos. Al asignárselo a alguien, hereda todos.
          </p>
        </div>
        <button class="principal" id="btn-nuevo-rol">Nuevo rol</button>
      </div>

      <table>
        <tr><th>Rol</th><th>Permisos</th><th>Usuarios</th>
            <th style="text-align:right">Acciones</th></tr>
        ${estado.roles.map(filaRol).join("")}
      </table>
    </section>`;

  elem("btn-nuevo-rol").onclick = () => abrirRol(null);

  document.querySelectorAll("[data-editar-rol]").forEach(b =>
    b.onclick = () => abrirRol(b.dataset.editarRol));

  document.querySelectorAll("[data-borrar-rol]").forEach(b =>
    b.onclick = () => eliminarRol(b.dataset.borrarRol, b.dataset.nombre));
}

function filaRol(r) {
  return `<tr>
    <td>
      <div>${esc(r.nombre)}
        ${r.delSistema ? '<span class="insignia i-tenue">del sistema</span>' : ""}
      </div>
      <div class="tenue" style="font-size:12.5px">${esc(r.descripcion)}</div>
    </td>
    <td>${r.permisos.length}</td>
    <td>${r.usuarios}</td>
    <td style="text-align:right;white-space:nowrap">
      ${r.delSistema
        ? '<span class="tenue" style="font-size:12.5px" ' +
          'title="Los roles del sistema no se editan para que el panel ' +
          'nunca quede sin quien lo administre.">protegido</span>'
        : `<button class="mini" data-editar-rol="${r.id}">Editar</button>
           <button class="mini peligro" data-borrar-rol="${r.id}"
                   data-nombre="${esc(r.nombre)}">Eliminar</button>`}
    </td>
  </tr>`;
}

function abrirRol(rolId) {
  estado.rolEditando = rolId;

  const rol = rolId ? estado.roles.find(r => r.id === rolId) : null;

  elem("rol-titulo").textContent = rol ? `Editar ${rol.nombre}` : "Nuevo rol";
  elem("rol-nombre").value = rol?.nombre ?? "";
  elem("rol-desc").value = rol?.descripcion ?? "";

  const marcados = rol?.permisos ?? [];

  // Los permisos se agrupan por área para que la lista se lea.
  // Trece casillas sueltas obligan a leerlas todas para encontrar una.
  const areas = [...new Set(estado.permisos.map(p => p.area))];

  elem("rol-permisos").innerHTML = areas.map(area => `
    <div class="area ${area === "Crítico" ? "critico" : ""}">
      <h3>${esc(area)}</h3>
      ${estado.permisos.filter(p => p.area === area).map(p => `
        <label class="permiso">
          <input type="checkbox" value="${esc(p.clave)}"
                 ${marcados.includes(p.clave) ? "checked" : ""}>
          <span class="texto">
            <span class="nombre">${esc(p.nombre)}</span>
            <span class="desc">${esc(p.descripcion)}</span>
          </span>
        </label>`).join("")}
    </div>`).join("");

  elem("velo-rol").classList.add("visible");
  elem("rol-nombre").focus();
}

elem("rol-cancelar").onclick = () =>
  elem("velo-rol").classList.remove("visible");

elem("rol-guardar").onclick = async () => {
  const nombre = elem("rol-nombre").value.trim();

  if (!nombre) {
    avisar("Escribe un nombre para el rol", "", "mal");
    return;
  }

  const permisos = [...elem("rol-permisos")
    .querySelectorAll("input:checked")].map(c => c.value);

  if (permisos.length === 0) {
    avisar("El rol no tiene permisos",
           "Quien lo tenga no podría hacer nada.", "mal");
    return;
  }

  const boton = elem("rol-guardar");
  boton.disabled = true;

  try {
    const cuerpo = JSON.stringify({
      nombre,
      descripcion: elem("rol-desc").value.trim(),
      permisos
    });

    if (estado.rolEditando) {
      await api(`/admin/roles/${estado.rolEditando}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: cuerpo
      });

      avisar("Rol actualizado",
             "Se aplica en la siguiente petición de cada usuario.", "ok");

    } else {
      await api("/admin/roles", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: cuerpo
      });

      avisar("Rol creado", "", "ok");
    }

    elem("velo-rol").classList.remove("visible");
    await cargar();

  } catch (e) {
    avisar(e.message, e.detalle, "mal");
  } finally {
    boton.disabled = false;
  }
};

async function eliminarRol(rolId, nombre) {
  const seguro = await confirmar(
    `Eliminar el rol ${nombre}`,
    "Solo se puede si nadie lo tiene asignado. Si alguien lo usa, cámbiale " +
    "el rol primero: si desapareciera, quedaría sin permisos y sin saber " +
    "por qué.",
    "Eliminar");

  if (!seguro) return;

  try {
    await api(`/admin/roles/${rolId}`, { method: "DELETE" });
    avisar("Rol eliminado", "", "ok");
    await cargar();
  } catch (e) {
    avisar(e.message, e.detalle, "mal");
  }
}

cargarUsuario().then(ok => { if (ok) cargar(); });
</script>
