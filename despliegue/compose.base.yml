# =============================================================================
# SERVIDOR DE BASE DE DATOS (QA, opción B′) — las dos bases PostgreSQL.
#
#   docker compose -f compose.base.yml --env-file .env.base up -d
#
# Lo explica GUIA-QA.md. Lo esencial:
#   - Las bases escuchan SOLO en la IP PRIVADA de este servidor (IP_PRIVADA),
#     la de la red privada del proveedor. Nunca en la pública.
#     OJO: Docker se salta ufw con los puertos publicados; por eso se publica
#     en la IP privada y no en 0.0.0.0.
#   - migrar.sh, respaldo.sh y restaurar.sh se corren AQUÍ (comun.sh apunta a
#     este archivo).
#   - .env.base nunca entra en git ni sale de este servidor.
# =============================================================================

name: reyban-base

x-registro: &registro
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  db-facturacion:
    image: postgres:16-alpine
    <<: *registro
    restart: unless-stopped
    environment:
      POSTGRES_USER: facturacion_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_FACTURACION:?falta en .env.base}
      POSTGRES_DB: facturacion
      TZ: UTC
      PGTZ: UTC
    volumes:
      - datos_facturacion:/var/lib/postgresql/data
    ports:
      - "${IP_PRIVADA:?falta en .env.base}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion_owner -d facturacion"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  db-plataforma:
    image: postgres:16-alpine
    <<: *registro
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PLATAFORMA:?falta en .env.base}
      POSTGRES_DB: plataforma
      TZ: UTC
      PGTZ: UTC
    volumes:
      - datos_plataforma:/var/lib/postgresql/data
    ports:
      - "${IP_PRIVADA:?falta en .env.base}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plataforma"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

volumes:
  datos_facturacion:
  datos_plataforma: